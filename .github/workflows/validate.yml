name: Validate layouts
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validator tests
        run: python3 -m unittest discover tests
      - name: Validate every layout and check index.json is up to date
        run: |
          python3 tools/validate.py
          cp index.json /tmp/index.before.json
          python3 tools/validate.py --write-index
          diff -u /tmp/index.before.json index.json || { echo "index.json is out of date: run python3 tools/validate.py --write-index"; exit 1; }
